[package]
name = "pluto-backend-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI bridge to Pluto's Rust timeline and media engine"

[lib]
name = "pluto_backend"
crate-type = ["cdylib"]

[dependencies]
pluto-timeline-core = { path = "../timeline-core" }
serde_json = "1"

# Native GPU preview compositor. FFmpeg remains responsible for codec decode/encode only.
# Keep the public API, patched HAL, and native GL wrapper on one compatible release set.
# The WGL interop build script patches wgpu-hal 0.19.4, and glow's native handle
# types must be identical to the ones used inside that HAL build.
wgpu = "=0.19.4"
wgpu-hal = { version = "=0.19.4", default-features = false }
pollster = "0.3"
glow = "=0.13.1"
bytemuck = { version = "1.15", features = ["derive"] }
rayon = "1.10"
# Static, decode-only FFmpeg 9 libraries are provided by the Windows build workflow.
ffmpeg-next = { version = "=9.1.0", default-features = false, features = ["codec", "format", "static"] }
