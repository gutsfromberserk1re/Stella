edition = "2021"
description = "C ABI bridge to Pluto's Rust timeline and media engine"

[lib]
name = "pluto_backend"
crate-type = ["cdylib"]

[dependencies]
pluto-timeline-core = { path = "../timeline-core" }
serde_json = "1"
wgpu = "0.19.4"
pollster = "0.3"
