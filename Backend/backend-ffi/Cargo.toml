[package]
name = "pluto-backend-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI bridge to Pluto's Rust timeline and media engine"

[lib]
name = "pluto_backend"
crate-type = ["cdylib"]

[dependencies]
pluto-timeline-core = { path = "../timeline-core" }
serde_json = "1"

# Native GPU preview compositor. FFmpeg remains responsible for codec decode/encode only.
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1.15", features = ["derive"] }
