
name: Build Stella for Windows

on:
  push:
  workflow_dispatch:

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install static FFmpeg decoder libraries and libclang
        shell: pwsh
        run: |
          $version = 'v9.0.2-3'
          $archiveName = 'ffmpeg-decode-static-x86_64-pc-windows-msvc.tar.xz'
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-decode-static'
          $url = "https://github.com/martinfrancois/ffmpeg-decode-static/releases/download/$version/$archiveName"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expectedSha256 = '7821646cb2183f20ef714acaa54575a25d2fe9e50d46bb497e156324d125d766'
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Static FFmpeg decoder archive checksum mismatch: $actualSha256"
          }
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          tar.exe -xf $archive -C $extract
          if (-not (Test-Path (Join-Path $extract 'include/libavcodec/avcodec.h')) -or
              -not (Test-Path (Join-Path $extract 'lib/avcodec.lib'))) {
            throw 'The static FFmpeg decoder archive did not contain the expected MSVC headers and libraries'
          }
          "FFMPEG_DIR=$($extract -replace '\\','/')" | Add-Content -Path $env:GITHUB_ENV

          $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            choco install llvm --no-progress --yes
          }
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            $clang = Get-ChildItem -Path $env:ProgramFiles -Filter libclang.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $clang) { throw 'libclang.dll was not found; ffmpeg-sys-next needs LLVM/libclang for binding generation' }
            $llvmBin = $clang.DirectoryName
          }
          "LIBCLANG_PATH=$llvmBin" | Add-Content -Path $env:GITHUB_ENV
          $llvmBin | Add-Content -Path $env:GITHUB_PATH

      - name: Test timeline core
        run: cargo test --manifest-path Backend/Cargo.toml -p pluto-timeline-core

      - name: Build Rust C ABI backend
        run: cargo build --release --manifest-path Backend/Cargo.toml -p pluto-backend-ffi

      - name: Install UCRT64 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache

      - name: Cache raylib and clay sources
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            raylib-src
            clay.h
          key: deps-raylib-6.2-clay-v0.14

      - name: Download Clay header
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nicbarker/clay/v0.14/clay.h" -OutFile "clay.h"

      - name: Download raylib
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch 6.2 https://github.com/raysan5/raylib.git raylib-src

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-raylib-6.2-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-raylib-6.2-

      - name: Build UI
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPRESS: "1"
          CCACHE_MAXSIZE: 200M
        run: |
          set -euo pipefail

          SOURCE="Frontend/main.c"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: $SOURCE not found"
            echo "Expected project structure:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Building $SOURCE"

          mkdir -p ci-build

          cat > ci-build/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.22)
          project(StellaUI C RC)

          set(CMAKE_C_STANDARD 99)
          set(CMAKE_C_STANDARD_REQUIRED ON)

          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(USE_EXTERNAL_GLFW OFF CACHE STRING "" FORCE)

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/../raylib-src"
              "${CMAKE_CURRENT_BINARY_DIR}/raylib"
          )

          if(NOT DEFINED UI_SOURCE_FILE)
              message(FATAL_ERROR "UI_SOURCE_FILE missing")
          endif()

          add_executable(
              Stella
              "${CMAKE_CURRENT_LIST_DIR}/../${UI_SOURCE_FILE}"
          )

          file(TO_CMAKE_PATH "${CMAKE_CURRENT_LIST_DIR}/../Icons/Logo/Stella.ico" STELLA_ICON)
          file(WRITE "${CMAKE_CURRENT_BINARY_DIR}/Stella.rc" "1 ICON \"${STELLA_ICON}\"\n")
          target_sources(Stella PRIVATE "${CMAKE_CURRENT_BINARY_DIR}/Stella.rc")

          target_include_directories(Stella PRIVATE
              "${CMAKE_CURRENT_LIST_DIR}/.."
              "${CMAKE_CURRENT_LIST_DIR}/../Frontend"
          )

          target_link_libraries(Stella PRIVATE raylib)

          if(MINGW)
              target_link_options(Stella PRIVATE -static -static-libgcc -mwindows)
              target_link_libraries(Stella PRIVATE opengl32 gdi32 winmm comdlg32)
          endif()

          set_target_properties(Stella PROPERTIES
              RUNTIME_OUTPUT_DIRECTORY "${CMAKE_CURRENT_BINARY_DIR}/dist"
          )
          CMAKE

          ccache --zero-stats

          cmake -S ci-build -B ci-build/out -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DUI_SOURCE_FILE="$SOURCE"

          cmake --build ci-build/out --parallel

          ccache --show-stats

          test -f ci-build/out/dist/Stella.exe

      - name: Package Rust backend and FFmpeg decoder build materials
        shell: pwsh
        run: |
          Copy-Item Backend\target\release\pluto_backend.dll ci-build\out\dist\pluto_backend.dll -Force
          $decoderDir = Join-Path ci-build\out\dist 'ffmpeg-decode-static'
          New-Item -ItemType Directory -Path $decoderDir -Force | Out-Null
          Copy-Item (Join-Path $env:FFMPEG_DIR 'BUILD-INFO') $decoderDir -Force
          Copy-Item (Join-Path $env:FFMPEG_DIR 'licenses') $decoderDir -Recurse -Force
          Copy-Item (Join-Path $env:FFMPEG_DIR 'lib') $decoderDir -Recurse -Force
          Copy-Item (Join-Path $env:FFMPEG_DIR 'include') $decoderDir -Recurse -Force
          @'
          Stella links the LGPL-2.1-or-later decode-only FFmpeg libraries from:
          https://github.com/martinfrancois/ffmpeg-decode-static
          The exact archive, upstream source versions, checksums and build configuration are recorded in BUILD-INFO.
          See the licenses directory for FFmpeg, dav1d and zlib license texts.
          The FFmpeg command-line tools bundled in the full package are distributed separately and have their own GPL notices.
          '@ | Set-Content -LiteralPath (Join-Path $decoderDir 'THIRD_PARTY_NOTICES.txt') -Encoding UTF8

      - name: Package UI icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ci-build/out/dist/Icons -Force | Out-Null
          Copy-Item -Path Icons\* -Destination ci-build/out/dist/Icons -Recurse -Force

      - name: Upload lightweight Stella package
        uses: actions/upload-artifact@v4
        with:
          name: Stella-Windows-x64-lite
          path: ci-build/out/dist/*
          if-no-files-found: error

      - name: Bundle FFmpeg runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $bin = Get-ChildItem -LiteralPath $extract -Directory -Filter bin -Recurse | Select-Object -First 1
          if (-not $bin) { throw 'FFmpeg archive did not contain a bin directory' }
          $dest = Join-Path (Resolve-Path ci-build/out/dist).Path 'ffmpeg'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path (Join-Path $bin.FullName '*') -Destination $dest -Recurse -Force
          Copy-Item -LiteralPath LICENSE -Destination (Join-Path $dest 'LICENSE-GPL-3.txt') -Force
          Get-ChildItem -LiteralPath $extract -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|README)' } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $dest $_.Name) -Force
          }
          $notice = @'
          FFmpeg is provided by BtbN/FFmpeg-Builds using a GPL shared Windows x64 build.
          Source and corresponding build project: https://github.com/FFmpeg/FFmpeg and https://github.com/BtbN/FFmpeg-Builds
          Build archive: ffmpeg-master-latest-win64-gpl-shared.zip (resolved at workflow run time)
          FFmpeg is licensed under the GNU General Public License version 3 or later.
          This package includes FFmpeg executable files and their shared runtime DLLs.
          '@
          $notice | Set-Content -LiteralPath (Join-Path $dest 'THIRD_PARTY_NOTICES.txt') -Encoding UTF8

      - name: Upload Stella package with FFmpeg
        uses: actions/upload-artifact@v4
        with:
          name: Stella-Windows-x64-full
          path: ci-build/out/dist/*
          if-no-files-found: error
